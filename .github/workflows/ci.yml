name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          # We set cache: npm explicitly; disable auto packageManager detection.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Urdu check
        run: npm run check:urdu

      - name: Unit tests
        run: npm run test

      - name: Audit (critical severity)
        # Transitive Sanity CLI / eslint toolchain highs remain until upstream;
        # never npm audit fix --force (downgrades Sanity to v5).
        run: npm audit --audit-level=critical

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: placeholder
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: '2024-01-01'
          NEXT_PUBLIC_SITE_URL: 'https://darulquran.pk'
